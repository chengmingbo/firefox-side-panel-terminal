<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side Panel Terminal</title>
    <link rel="stylesheet" href="../vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body class="spt-root" data-theme="auto">
    <header class="spt-header">
      <button id="new-session" class="spt-icon-btn" title="New session (Alt+Shift+N)" aria-label="New session">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="reconnect" class="spt-icon-btn" title="Reconnect (Alt+Shift+D)" aria-label="Reconnect">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 12a9 9 0 0115.5-6.3M21 12a9 9 0 01-15.5 6.3M21 4v5h-5M3 20v-5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="spt-header-spacer"></div>
      <span id="status" class="spt-status" data-state="disconnected">disconnected</span>
      <button id="open-options" class="spt-icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 9a3 3 0 100 6 3 3 0 000-6zm9 3l-2.1-.4a7 7 0 00-.7-1.7l1.3-1.7-2.1-2.1-1.7 1.3a7 7 0 00-1.7-.7L13.6 3h-3l-.4 2.1a7 7 0 00-1.7.7L6.8 4.5 4.7 6.6l1.3 1.7a7 7 0 00-.7 1.7L3 10.4v3l2.1.4a7 7 0 00.7 1.7l-1.3 1.7 2.1 2.1 1.7-1.3a7 7 0 001.7.7l.4 2.1h3l.4-2.1a7 7 0 001.7-.7l1.7 1.3 2.1-2.1-1.3-1.7a7 7 0 00.7-1.7L21 13.4v-3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main id="terminal-host" class="spt-terminal-host">
      <div id="terminal" class="spt-terminal"></div>
      <div id="overlay" class="spt-overlay" hidden>
        <div class="spt-overlay-card">
          <h2>Side Panel Terminal</h2>
          <p id="overlay-msg">Connecting…</p>
          <button id="overlay-action" class="spt-btn spt-btn-primary" hidden>Retry</button>
        </div>
      </div>
    </main>

    <footer class="spt-footer">
      <span id="meta" class="spt-meta"></span>
    </footer>

    <!-- Vendored xterm.js (UMD) loads first, then our glue. -->
    <script src="../vendor/xterm/xterm.js"></script>
    <script src="../vendor/xterm/xterm-addon-fit.js"></script>
    <script src="../vendor/xterm/xterm-addon-web-links.js"></script>
    <script type="module" src="sidebar.js"></script>
  </body>
</html>
